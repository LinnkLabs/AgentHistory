<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent History — Claude sessions</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="railtoggle" class="iconbtn railtoggle" title="Projects">☰</button>
    <div class="brand">◆ Agent&nbsp;History</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="now">Now</button>
      <button class="tab" data-view="sessions">Sessions</button>
    </nav>
    <div class="searchwrap">
      <input id="q" class="search" type="search" placeholder="Search all sessions…  (Enter)" autocomplete="off" />
      <select id="scope" class="scope" title="Search scope">
        <option value="global">All projects</option>
        <option value="project">This project</option>
        <option value="session">This session</option>
      </select>
    </div>
    <div class="targets" id="targets">
      <button class="chip active" data-target="all">All</button>
      <button class="chip" data-target="input">Your input</button>
      <button class="chip" data-target="output">Claude output</button>
      <button class="chip" data-target="commands">Commands</button>
      <button class="chip" data-target="toolout">Tool output</button>
    </div>
    <div class="stats" id="stats"></div>
    <span id="live" class="livedot" title="Live — index auto-updates"></span>
    <button id="insights" class="navbtn" title="Retro & context book">✦ Insights</button>
    <a id="portrait" class="navbtn portraitbtn" href="/portrait.html" title="Your Agent Portrait — the story of you × your agents">✨ Portrait</a>
    <button id="theme" class="iconbtn" title="Toggle light / dark">☾</button>
  </header>

  <section class="boardview" id="boardview" hidden>
    <div class="boardbar">
      <select id="bproject" class="scope" title="Filter board by project"><option value="">All projects</option></select>
      <span class="bmeta" id="bmeta"></span>
      <span style="flex:1"></span>
      <button id="refineai" class="btn" hidden>✨ Refine with AI</button>
    </div>
    <div class="bcols" id="bcols"></div>
    <div class="bdone" id="bdone" hidden></div>
  </section>

  <main class="layout">
    <aside class="rail" id="rail"><!-- projects (O1) --></aside>
    <div class="resizer" id="rz-rail" title="Drag to resize"></div>
    <section class="listcol">
      <div class="listhead" id="listhead"></div>
      <div class="list" id="list"><!-- session cards or search hits --></div>
    </section>
    <div class="resizer" id="rz-list" title="Drag to resize"></div>
    <section class="detail" id="detail">
      <div class="empty">Select a session, or search across everything.</div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
