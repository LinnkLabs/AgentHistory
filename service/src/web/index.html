<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent History — agent sessions</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="railtoggle" class="iconbtn railtoggle" title="Projects">☰</button>
    <div class="brand">◆ Agent&nbsp;History</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="sessions">Sessions</button>
      <button class="tab" data-view="now">Now</button>
    </nav>
    <div class="searchwrap">
      <span class="searchicon">⌕</span>
      <input id="q" class="search" type="search" placeholder="Search everything — then open or copy" autocomplete="off" />
      <kbd class="kbd" id="kbdhint">⌘K</kbd>
    </div>
    <select id="scope" class="scope" title="Search scope">
      <option value="global">All projects</option>
      <option value="project">This project</option>
      <option value="session">This session</option>
    </select>
    <span id="live" class="livedot" title="Live — index auto-updates"></span>
    <div class="more">
      <button id="morebtn" class="iconbtn" title="More">⋯</button>
      <div id="moremenu" class="moremenu" hidden>
        <div class="stats mm-stats" id="stats"></div>
        <button id="insights" class="mm-item" title="Retro & context book">✦ Insights</button>
        <a id="portrait" class="mm-item portraitbtn" href="/portrait.html" title="Your Agent Portrait — the story of you × your agents">✨ Your Portrait</a>
        <button id="theme" class="mm-item" title="Toggle light / dark">☾ Toggle theme</button>
      </div>
    </div>
  </header>

  <section class="boardview" id="boardview" hidden>
    <div class="boardbar">
      <select id="bproject" class="scope" title="Filter board by project"><option value="">All projects</option></select>
      <span class="bmeta" id="bmeta"></span>
      <span style="flex:1"></span>
      <button id="refineai" class="btn" hidden>✨ Refine with AI</button>
    </div>
    <div class="bcols" id="bcols"></div>
    <div class="bdone" id="bdone" hidden></div>
  </section>

  <main class="layout">
    <aside class="rail" id="rail"><!-- projects (O1) --></aside>
    <div class="resizer" id="rz-rail" title="Drag to resize"></div>
    <section class="listcol">
      <div class="listhead" id="listhead"></div>
      <div class="list" id="list"><!-- session cards or search hits --></div>
    </section>
    <div class="resizer" id="rz-list" title="Drag to resize"></div>
    <section class="detail" id="detail">
      <div class="emptyflow" id="emptyflow">
        <div class="ef-head">
          <div class="ef-title" id="ef-title">Search your sessions</div>
          <div class="ef-sub">Everything Claude Code and Codex did on this machine, indexed locally.</div>
        </div>
        <div class="ef-steps">
          <div class="ef-step"><span class="ef-ico i-search">⌕</span><span class="ef-k">Search</span><span class="ef-d">a phrase, path, or command</span></div>
          <span class="ef-arrow">→</span>
          <div class="ef-step"><span class="ef-ico i-locate">◎</span><span class="ef-k">Locate</span><span class="ef-d">jump to the exact message</span></div>
          <span class="ef-arrow">→</span>
          <div class="ef-step"><span class="ef-ico i-act">✱</span><span class="ef-k">Act</span><span class="ef-d">open in your IDE, or copy</span></div>
        </div>
        <div class="ef-tries" id="ef-tries"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
